name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build release binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="wirecase-${GOOS}-${GOARCH}${ext}"
          version="${RELEASE_TAG#v}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/iamtonmoy0/wirecase/internal/cli.version=${version}" -o "dist/${name}" .
          cd dist
          zip "${name}.zip" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: wirecase-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
